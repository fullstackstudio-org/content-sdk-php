; Small and fast: a site that serves a handful of requests per second does not need more.
memory_limit = 64M
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
max_execution_time = 30
; Upload limits (upload_max_filesize, post_max_size, memory_limit) are set by the entrypoint from FSC_UPLOAD_MAX_MB, together with nginx.
max_file_uploads = 20
realpath_cache_size = 256k
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0
; The image is immutable: files never change, so never stat them.
opcache.validate_timestamps = 0
opcache.memory_consumption = 32
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.jit = disable
opcache.save_comments = 1
