[global]
error_log = /dev/stderr
daemonize = no

[www]
listen = /tmp/php-fpm.sock
listen.mode = 0660
; ondemand: no idle workers, so an idle site costs only the FPM master.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
; The environment of the container (APP_KEY, FSC_*) must reach PHP.
clear_env = no
