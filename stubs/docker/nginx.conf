# Runs as the unprivileged user: every writable path is in /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
daemon off;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    keepalive_timeout 30;
    # client_max_body_size: written by the entrypoint from FSC_UPLOAD_MAX_MB (same limit as PHP).
    include /tmp/nginx-upload.conf;
    # Safety net: several Set-Cookie headers in one response must not hit "upstream sent too big header" (502).
    large_client_header_buffers 4 16k;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;
    fastcgi_busy_buffers_size 32k;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 512;

    server {
        listen 3000 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        location ~ /\.(?!well-known) { deny all; }

        # Vite output is content-hashed.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri /index.php?$query_string;
        }

        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_pass unix:/tmp/php-fpm.sock;
            fastcgi_read_timeout 30s;
            # Larger header buffers: session/flash cookies on form errors must not trigger 502 "upstream sent too big header".
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
        }

        location ~ \.php$ { return 404; }
    }
}
